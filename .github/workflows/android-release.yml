name: Android APK — build and publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to build (e.g. v0.6.0); manual runs do not publish'
        required: true
        default: 'v0.5.1'
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
    steps:
      - name: Check out project and overrides
        uses: actions/checkout@v4

      - name: Choose version and validate tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ -f release-request.txt ]; then TAG="$(tr -d '\r\n' < release-request.txt)"; else TAG="v0.5.1"; fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Use a tag like v0.6.0"
            exit 1
          fi
          CODE=$((10#${BASH_REMATCH[1]}*10000 + 10#${BASH_REMATCH[2]}*100 + 10#${BASH_REMATCH[3]}))
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Download the verified source package from v0.5.1
        shell: bash
        run: |
          mkdir -p source-download
          if ! gh release download v0.5.1 --repo "$GITHUB_REPOSITORY"                --pattern 'ChitayuSam-source.zip' --dir source-download; then
            echo "::error::First attach ChitayuSam-source.zip to the v0.5.1 GitHub Release."
            exit 1
          fi
          echo '806d00de0ba075e751970f663a8a6bc1a85d6d5f4574632133752036409aadd5  source-download/ChitayuSam-source.zip' | sha256sum --check --
          unzip -q source-download/ChitayuSam-source.zip -d build-source
          test -f build-source/android/app/build.gradle
          test -f build-source/android/app/src/main/assets/index.html

      - name: Apply optional source overrides from this repository
        shell: bash
        run: |
          if [ -d overrides/android ]; then
            cp -a overrides/android/. build-source/android/
          fi

      - name: Apply checked v0.6.0 curriculum and art package
        shell: bash
        run: |
          if [ -f overrides/v060-pack.txt ]; then
            python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          raw=Path('overrides/v060-pack.txt').read_text(encoding='ascii').strip()
          if hashlib.sha256((raw+'\n').encode()).hexdigest()!='57448528105ffebaa9f70459c2218808c914e27a9216e668a8e72840e3196e18':
              raise SystemExit('Unverified v0.6 source package')
          pack=json.loads(gzip.decompress(base64.b64decode(raw,validate=True)))
          if pack.get('schema')!=1: raise SystemExit('Unknown curriculum patch schema')
          root=Path('build-source/android/app/src/main/assets')
          for name,patch in pack['patches'].items():
              if name not in ('app.js','style.css'): raise SystemExit('Unexpected patch name')
              path=root/name
              data=path.read_text(encoding='utf8')
              sha=lambda t: hashlib.sha256(t.encode('utf8')).hexdigest()
              if sha(data)!=patch['old_sha256']: raise SystemExit('Unexpected baseline: '+name)
              for start,end,text in reversed(patch['edits']):
                  data=data[:start]+text+data[end:]
              if sha(data)!=patch['new_sha256']: raise SystemExit('Patch checksum mismatch: '+name)
              path.write_text(data,encoding='utf8')
          (root/'kai-wolf.svg').write_text(pack['extra']['kai-wolf.svg'],encoding='utf8')
          print('v0.6 curriculum and original Kai avatar applied')
          PY
          fi

      - name: Set Android version from release tag
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path('build-source/android')
          gradle=root/'app/build.gradle'
          data=gradle.read_text(encoding='utf-8')
          data,n1=re.subn(r'(?m)^\s*versionCode\s+\d+', '        versionCode '+os.environ['VERSION_CODE'], data)
          data,n2=re.subn(r"(?m)^\s*versionName\s+'[^']+'", "        versionName '"+os.environ['VERSION_NAME']+"'", data)
          if n1!=1 or n2!=1: raise SystemExit('Version fields missing/ambiguous')
          # Force the debug variant to sign with exactly the restored keystore.
          # Gradle's default location may vary on CI runners.
          signing = """    signingConfigs {
                  debug {
                      storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          """
          if data.count('    defaultConfig {') != 1:
              raise SystemExit('Could not find unique defaultConfig block')
          data=data.replace('    defaultConfig {',signing+'    defaultConfig {',1)
          gradle.write_text(data,encoding='utf-8')
          js=root/'app/src/main/assets/app.js'
          script=js.read_text(encoding='utf-8')
          script,n3=re.subn(r"const VERSION='[0-9]+[.][0-9]+[.][0-9]+'", "const VERSION='"+os.environ['VERSION_NAME']+"'", script, count=1)
          if n3 != 1: raise SystemExit('UI VERSION not found')
          js.write_text(script,encoding='utf-8')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Android SDK tools available
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9 (source has no wrapper JAR)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore the ORIGINAL Samsung signing key from GitHub Secret
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret ANDROID_DEBUG_KEYSTORE_B64. Do not build with a new debug key."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"

      - name: Verify the GitHub signing secret BEFORE building
        shell: bash
        run: |
          mkdir -p baseline
          gh release download v0.5.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'ChitayuSam.apk' --dir baseline
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OLD="$("$APKSIGNER" verify --print-certs baseline/ChitayuSam.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          # Exports ONLY the public X.509 certificate; does not expose the private key.
          FROM_SECRET="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | cut -d' ' -f1)"
          echo "Published v0.5.1 certificate: ${OLD:-missing}"
          echo "Certificate inside GitHub Secret: ${FROM_SECRET:-missing}"
          {
            echo "### Signing secret preflight"
            echo "| Source | Certificate SHA-256 |"
            echo "| --- | --- |"
            echo "| Published v0.5.1 | \`${OLD:-missing}\` |"
            echo "| Keystore from GitHub Secret | \`${FROM_SECRET:-missing}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$OLD" ] || [ -z "$FROM_SECRET" ] || [ "$OLD" != "$FROM_SECRET" ]; then
            echo "::error::The keystore stored in GitHub Secrets is NOT the one that signed the installed v0.5.1 APK. Stop here. Verify the keystore on the Mac and replace ANDROID_DEBUG_KEYSTORE_B64."
            exit 1
          fi

      - name: Build signed APK
        shell: bash
        working-directory: build-source/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify signature matches published v0.5.1 APK
        shell: bash
        run: |
          # The preflight step already downloaded this exact baseline APK.
          # Re-downloading it makes gh fail with "already exists".
          test -s baseline/ChitayuSam.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OLD="$("$APKSIGNER" verify --print-certs baseline/ChitayuSam.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          NEW="$("$APKSIGNER" verify --print-certs build-source/android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          echo "Published v0.5.1 certificate SHA-256: ${OLD:-not found}"
          echo "GitHub-built APK certificate SHA-256: ${NEW:-not found}"
          {
            echo "### Android signing certificate comparison"
            echo ""
            echo "| APK | Certificate SHA-256 |"
            echo "| --- | --- |"
            echo "| Published v0.5.1 | \`${OLD:-not found}\` |"
            echo "| Newly built | \`${NEW:-not found}\` |"
            echo ""
            echo "These are public certificate fingerprints, not the private signing key."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$OLD" ] || [ -z "$NEW" ] || [ "$OLD" != "$NEW" ]; then
            echo "::error::Signing certificate mismatch. No APK published. Confirm the original Mac debug.keystore and the v0.5.1 baseline APK, then replace the GitHub Secret only if necessary."
            exit 1
          fi
          cp build-source/android/app/build/outputs/apk/debug/app-debug.apk ChitayuSam.apk
          sha256sum ChitayuSam.apk > ChitayuSam.apk.sha256
          echo "Verified signature SHA-256 certificate: $NEW"

      - name: Keep APK as a downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChitayuSam-${{ env.VERSION_NAME }}
          path: |
            ChitayuSam.apk
            ChitayuSam.apk.sha256

      - name: Publish only authorized, tested version requests
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            if [ ! -f release-request.txt ]; then
              echo 'Validation run: no release requested.'
              exit 0
            fi
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo 'Release already published; not replacing its assets.'
              exit 0
            fi
            if [ "$RELEASE_TAG" != "v0.6.0" ]; then
              echo "::error::This request workflow only authorizes v0.6.0."
              exit 1
            fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Читаю сам — Серебряный лес $RELEASE_TAG" \
              --notes "Новые самостоятельные занятия до 20 этапов, составление слов из частей и анимированный волк Кай. Старые данные сохраняются; установку на Samsung подтверждает взрослый."
          else
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --title "Читаю сам — Серебряный лес $RELEASE_TAG" \
                --notes "Обновление приложения. Установка подтверждается взрослым." --verify-tag
            fi
          fi
          gh release upload "$RELEASE_TAG" ChitayuSam.apk ChitayuSam.apk.sha256 --repo "$GITHUB_REPOSITORY"
